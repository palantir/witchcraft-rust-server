[package]
name = "witchcraft-server"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "A highly opinionated embedded application server for RESTy APIs, compatible with the Witchcraft ecosystem"
repository = "https://github.com/palantir/witchcraft-rust-server"
readme = "../README.md"

[[package.metadata.sls.diagnostics]]
type = "diagnostic.types.v1"
docs = "All supported diagnostic types returnable from the server."

[[package.metadata.sls.diagnostics]]
type = "metric.names.v1"
docs = "All currently emitted metrics and their tags."

[[package.metadata.sls.diagnostics]]
type = "rust.heap.stats.v1"
docs = "Statistics about the memory allocator, in jemalloc's default text format."

[[package.metadata.sls.diagnostics]]
type = "rust.heap.profile.v1"
docs = "A sample of live allocations, in the jemalloc profile format."

[[package.metadata.sls.diagnostics]]
type = "rust.thread.dump.v1"
docs = "A recording of running threads and their respective stacktraces."

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemalloc-ctl", "dep:tikv-jemallocator"]
in-memory-testing = []

[dependencies]
arc-swap = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
conjure-error = "5.0.0"
conjure-http = "5.0.0"
conjure-object = "5.0.0"
conjure-runtime = "7.0.0"
conjure-serde = "5.0.0"
crash-handler = "0.7"
flate2 = "1"
foreign-types = "0.5"
futures-channel = "0.3"
futures-sink = "0.3"
futures-util = "0.3"
futures = { version = "0.3.30", features = ["executor"] }
http-body-util = "0.1"
http-body = "1"
http-zipkin = "1.0"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
itertools = "0.15"
lazycell = "1.3"
libc = "0.2"
log = "0.4"
minidump-processor = "0.26"
minidump-unwind = { version = "0.26", features = ["debuginfo-symbols"] }
minidump-writer = "0.12"
minidump = "0.26"
minidumper = "0.10"
once_cell = "1"
parking_lot = "0.12"
pin-project = "1"
rand = "0.10"
refreshable = "2"
regex = "1"
rustls-pemfile = "2"
rustls-pki-types = "1.11.0"
rustls-webpki = "0.103"
serde-encrypted-value = "1.0"
serde-file-value = "0.1"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11.0"
socket2 = "0.6"
staged-builder = "0.2.0"
subtle = "2.5"
sync_wrapper = "1.0"
tempfile = "3.10.1"
tikv-jemalloc-ctl = { version = "0.7", features = [
    "stats",
    "use_std",
], optional = true }
tikv-jemallocator = { version = "0.7", features = [
    "unprefixed_malloc_on_supported_platforms",
    "background_threads",
    "profiling",
], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
tokio-util = "0.7"
tokio = { version = "1.37", features = [
    "fs",
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }
tracing = { version = "0.1", features = ["log"] }
witchcraft-log-util = "2.0.0"
witchcraft-log = "5.0.0"
witchcraft-logging-api = "2.0.0"
witchcraft-metrics = "1"
witchcraft-server-config = { version = "6.9.0", path = "../witchcraft-server-config" }
witchcraft-server-macros = { version = "6.9.0", path = "../witchcraft-server-macros" }
zipkin = "1.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
