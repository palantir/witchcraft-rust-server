restore_registry: &RESTORE_REGISTRY
  restore_cache:
    key: registry
save_registry: &SAVE_REGISTRY
  save_cache:
    key: registry-{{ .BuildNum }}
    paths:
      - /usr/local/cargo/registry/index
deps_key: &DEPS_KEY
  key: deps-{{ checksum "~/rust-version" }}-{{ checksum "Cargo.lock" }}
restore_deps: &RESTORE_DEPS
  restore_cache:
    <<: *DEPS_KEY
save_deps: &SAVE_DEPS
  save_cache:
    <<: *DEPS_KEY
    paths:
      - target
      - /usr/local/cargo/registry/cache
      - /usr/local/cargo/registry/src

version: 2.1

orbs:
  win: circleci/windows@5.1.0

jobs:
  test-linux:
    docker:
      - image: rust:1.85.0
    environment:
      RUSTFLAGS: -D warnings
    steps:
      - checkout
      - run: rustup component add rustfmt clippy
      - *RESTORE_REGISTRY
      - run: cargo generate-lockfile
      - *SAVE_REGISTRY
      - run: rustc --version > ~/rust-version
      - *RESTORE_DEPS
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all --all-targets
      - run: cargo clippy -p witchcraft-server --no-default-features
      - run: cargo test --all
      - run: cargo run -p render-conjure
      - run: |
          FILES_MODIFIED="$(git status --porcelain)"
          if [[ -n "$FILES_MODIFIED" ]]; then
            echo "$FILES_MODIFIED"
            exit 1
          fi
      - *SAVE_DEPS
  test-windows:
    executor: win/default
    steps:
      - checkout
      - run: choco uninstall rust
      - run: choco install -y rustup.install
      - run: rustup default 1.85.0
      - restore_cache:
          key: win-registry
      - run: cargo generate-lockfile
      - save_cache:
          key: win-registry-{{ .BuildNum }}
          paths:
            - C:\Users\circleci\.cargo\registry\index
      - run: rustc --version > ..\rust-version
      - restore_cache:
          <<: *DEPS_KEY
      - run: cargo test --all
      - save_cache:
          <<: *DEPS_KEY
          paths:
            - target
            - C:\Users\circleci\.cargo\registry\cache
            - C:\Users\circleci\.cargo\registry\src
  circle-all:
    docker: [{ image: busybox }]
    resource_class: small
    steps:
      - run: {command: echo "All required jobs finished successfully"}

workflows:
  version: 2
  main:
    jobs:
      - test-linux:
          filters: { tags: { only: /.*/ } }
      - test-windows:
          filters: { tags: { only: /.*/ } }
      - circle-all:
          requires: [test-linux, test-windows]
          filters: { tags: { only: /.*/ } }
